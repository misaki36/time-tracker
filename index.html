<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- セキュリティのルール：このフォルダの中のファイル以外は読みこまない・動かさない -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- スマホでも見やすくするための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ブラウザのタブに出る名前（アプリ名が決まったらここを変える） -->
  <title>作業時間きろく</title>
  <!-- 見た目のファイル(CSS)を読みこむ -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <!-- アプリの名前 -->
    <h1 class="app-title">作業時間きろく</h1>

    <!-- ===== ① いまの作業を選んで、時間をはかるところ ===== -->
    <section class="card">
      <h2 class="card-title">いまの作業</h2>

      <div class="select-row">
        <!-- サイト名を選ぶ（中身は設定のリストからJavaScriptで自動で入れる） -->
        <label class="select-label">
          サイト名
          <select id="site-select" class="select"></select>
        </label>

        <!-- 工程を選ぶ（中身は設定のリストからJavaScriptで自動で入れる） -->
        <label class="select-label">
          工程
          <select id="task-select" class="select"></select>
        </label>
      </div>

      <!-- 選んだ工程のひとこと説明（JavaScriptで自動で入れる） -->
      <p id="task-hint" class="task-hint"></p>
      <!-- 押すと下の「用語集」まで移動するリンク -->
      <a href="#glossary" class="glossary-link">言葉がわからないときは「用語集」へ</a>

      <!-- メモの入力欄（なくてもOK。はかっている途中でも書き直せる） -->
      <label class="memo-label">
        メモ（なくてもOK）
        <input id="memo-input" class="text-input" type="text" maxlength="100" placeholder="例：ヘッダー">
      </label>

      <!-- はかっている時間（作業時間）を表示するところ -->
      <p id="timer" class="timer">00:00:00</p>
      <!-- 休けいの時間を表示するところ（JavaScriptで自動で入れる） -->
      <p id="break-status" class="break-status"></p>

      <!-- ボタンを横にならべる -->
      <div class="btn-row">
        <!-- スタート／ストップのボタン（押すたびに切りかわる） -->
        <button id="start-stop-btn" class="btn btn-start" type="button">▶ スタート</button>
        <!-- 休けいボタン（はかっている途中だけ出る。hidden ＝ かくしておく） -->
        <button id="break-btn" class="btn btn-break" type="button" hidden>☕ 休けい</button>
      </div>
    </section>

    <!-- ===== ② サイトごとの合計時間（中に工程ごとの時間も出す） ===== -->
    <section class="card">
      <h2 class="card-title">サイトごとの合計</h2>
      <!-- 中身はJavaScriptで自動で入れる -->
      <ul id="total-list" class="total-list"></ul>
    </section>

    <!-- ===== ③ 記録の一覧 ===== -->
    <section class="card">
      <h2 class="card-title">記録の一覧</h2>
      <!-- スタートを押し忘れたとき用：記録を手で足すボタン -->
      <button id="add-record-btn" class="sub-btn" type="button">＋ 記録を手で足す</button>
      <!-- 中身はJavaScriptで自動で入れる -->
      <ul id="record-list" class="record-list"></ul>
    </section>

    <!-- ===== ④ 用語集（id="glossary" は、上のリンクの移動先） ===== -->
    <section id="glossary" class="card">
      <h2 class="card-title">用語集</h2>
      <p class="glossary-lead">Web制作の流れの順に並んでいます。言葉を押すと、くわしい説明が開きます。</p>
      <!-- 中身は glossary.js で自動で入れる -->
      <ul id="glossary-list" class="glossary-list"></ul>
    </section>

    <!-- ===== ⑤ サイト名・工程の設定（自分で追加・削除できる） ===== -->
    <section class="card">
      <h2 class="card-title">サイト名・工程の設定</h2>

      <!-- サイト名の設定 -->
      <div class="setting-block">
        <h3 class="setting-title">サイト名</h3>
        <!-- 入力して「追加」を押すと、選ぶリストに足される -->
        <form id="site-form" class="add-form">
          <input id="site-input" class="text-input" type="text" maxlength="30" placeholder="例：新しいサイト" required>
          <button class="add-btn" type="submit">追加</button>
        </form>
        <!-- 今あるサイト名の一覧（JavaScriptで自動で入れる） -->
        <ul id="site-setting-list" class="setting-list"></ul>
      </div>

      <!-- 工程の設定 -->
      <div class="setting-block">
        <h3 class="setting-title">工程</h3>
        <form id="task-form" class="add-form">
          <input id="task-input" class="text-input" type="text" maxlength="30" placeholder="例：打ち合わせ" required>
          <button class="add-btn" type="submit">追加</button>
        </form>
        <!-- 今ある工程の一覧（JavaScriptで自動で入れる） -->
        <ul id="task-setting-list" class="setting-list"></ul>
      </div>
    </section>
  </main>

  <!-- ===== 記録を直す・手で足す画面 =====
       dialog ＝ 画面の上に重ねて出す、まど のようなタグ（ふだんは見えない） -->
  <dialog id="edit-dialog" class="edit-dialog">
    <form id="edit-form" class="edit-form">
      <!-- 見出し（「記録を直す」か「記録を手で足す」に、JavaScriptで切りかえる） -->
      <h2 id="edit-title" class="card-title">記録を直す</h2>

      <label class="edit-field">
        サイト名
        <select id="edit-site" class="select"></select>
      </label>

      <label class="edit-field">
        工程
        <select id="edit-task" class="select"></select>
      </label>

      <label class="edit-field">
        メモ（なくてもOK）
        <input id="edit-memo" class="text-input" type="text" maxlength="100">
      </label>

      <!-- datetime-local ＝ 日にちと時刻を選べる入力欄 -->
      <label class="edit-field">
        始めた時刻
        <input id="edit-start" class="text-input" type="datetime-local" required>
      </label>

      <label class="edit-field">
        終わった時刻
        <input id="edit-end" class="text-input" type="datetime-local" required>
      </label>

      <!-- 休けいした時間（分）。number ＝ 数字だけ入れられる入力欄 -->
      <label class="edit-field">
        休けい（分）
        <input id="edit-break" class="text-input" type="number" min="0" step="1" value="0">
      </label>

      <!-- まちがった入力のときのお知らせ（JavaScriptで文字を入れる） -->
      <p id="edit-error" class="edit-error"></p>

      <div class="edit-actions">
        <button id="edit-cancel-btn" class="sub-btn" type="button">やめる</button>
        <button class="add-btn" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 動きのファイル(JavaScript)を読みこむ（bodyの一番さいごに書く） -->
  <script src="script.js"></script>
  <!-- 用語集のファイル（script.js の部品を使うので、必ず script.js の下に書く） -->
  <script src="glossary.js"></script>
  <!-- 記録を直すしくみ（script.js の部品を使うので、必ず script.js の下に書く） -->
  <script src="edit.js"></script>
</body>
</html>
